spring.application.name=hospital-management-system

# ----------------------------
# PostgreSQL Datasource
# ----------------------------
# Note: unlike MySQL, Postgres can't auto-create the database from the JDBC URL.
# Create it first: CREATE DATABASE hospital_db;
#
# Values below read from environment variables when set (for staging/prod),
# falling back to the ":default" after the colon for local development.
# Set real env vars in production — never rely on these defaults outside dev.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------
# JPA / Hibernate
# ----------------------------
# ddl-auto=update is convenient for local dev only. In staging/prod, use
# ddl-auto=validate and manage schema changes with Flyway/Liquibase instead —
# "update" can silently alter/drop columns against real data.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----------------------------
# JWT
# ----------------------------
# ALWAYS set JWT_SECRET as a real environment variable in production —
# the fallback below is a placeholder, not a secret.
jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToSomethingLongAndRandomForProductionUse1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----------------------------
# CORS
# ----------------------------
# Comma-separated list of frontend origins allowed to call this API.
# Add your deployed frontend's URL here in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ----------------------------
# Server
# ----------------------------
server.port=8080

# ----------------------------
# Swagger / OpenAPI
# ----------------------------
springdoc.swagger-ui.path=/swagger-ui.html
